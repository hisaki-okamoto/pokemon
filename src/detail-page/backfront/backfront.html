<div class="all">
  <div class="singlel" *ngIf="id > 1">
    <div class="top">
      <div class="tLeft">No.{{ frontNumber }}</div>
      <div class="tRight">
        {{ frontName }}
      </div>
    </div>
    <div class="bottom">
      <img [src]="frontSprite" alt="front" class="bottom">
    </div>
  </div>
  <div class="singler">
    <div class="top">
      <div class="tLeft">No.{{ backNumber }}</div>
      <div class="tRight">
        {{ backName }}
      </div>
    </div>
    <div class="bottom">
      <img [src]="backSprite" alt="back" class="bottom">
    </div>
  </div>
</div>
