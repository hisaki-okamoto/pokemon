<div class="data">
  <img [src]="sprite" alt="sprite" class="sprite">
  <div class="pokemonall">
    <div class="pokemon">
      <div class="id">No.{{ formatId }}</div>
      <div class="name">{{ name }}</div>
    </div>
    <div class="type"><type [dataType]="dataType"></type></div>
    <div class="shiny">
      <img [src]="shiny" alt="shiny" class="shiny" (click)="changeShiny()">
    </div>
  </div>
</div>
<div class="abilities"><abilities [abilities]="abilities"></abilities></div>
<div class="stats">
  <div class="stats"><stats [pokemonData]="pokemonData"></stats></div>
</div>
<div class="backfront">
  <backfront [id]="id" (select)="goPage($event)"></backfront>
</div>
